route[retry] {
      
    #if($avp(retry_did) =~"^\+96611521"){
    ## fetch new gateway_id, using retry_did

    if( $avp(retry_did) !=""){	
        xlog("'$rm' FROM $si TO $socket_in(ip) - call-id '$ci' - re-route $rU using Failover Operator \n");
        remove_hf("X-FOCID");
        xlog("trying with retry_did $avp(retry_did) \n");
        route(FETCH_GW_ID);
        xlog("gateway calculated $var(gw_id) \n");
        $var(new_uri) = "sip:"+$avp(retry_did)+"@sip.local";

        xlog("'$rm' FROM $si TO $socket_in(ip) - retry_did exists $avp(retry_did) - call-id '$ci' \n");
        uac_replace_from("",$var(new_uri));

        $var(new_rpid) = "<sip:"+$avp(retry_did)+"@sip.signalwire.com>;party=calling;screen=yes;privacy=off";
        remove_hf("Remote-Party-ID");
        append_hf("Remote-Party-ID: $var(new_rpid)\r\n");

        $var(lb_rc2) = lb_start($var(gw_id),"transc;pstn");

        remove_hf("X-FOCID");
        $avp(retry_did) ="";

        if( $var(lb_rc2) < 0 ) {
            xlog("'$rm' FROM $si TO $socket_in(ip) - secondary lb_start failed \n");
            sl_send_reply(500,"Service full");
            exit;
        
        } else{
            route(relay);
            exit;
        }
    } else{
    	xlog("Failover already processed\n");    
    }
    
    exit;	

}


