    ### check if call is international destination and header has value
    $avp(intl_carrier) = $hdr(X-CARRIER);
    xlog("'$rm' FROM $si TO $socket_in(ip) - call-id '$ci' - intl_carrier: $avp(intl_carrier) \n");

 
    ##### Route outbound calls to Zain PSTN GW
  
    route(FETCH_GW_ID);  

    if($var(gw_id) == 0){
    
        xlog("'$rm' FROM $si TO $socket_in(ip) - call-id '$ci' - Gateway id is null, Fetch rpid and recalculate the gateway \n");

        ####  Add PPID/RPID support for SIP UA which does not support CID Override
        avp_db_query("SELECT ppi FROM callerid WHERE subscriber='$fU'", "$avp(sub_rpid)");

        #P-Preferred-Identity: "<sip:+966115219548@sip.local>"

        # There is a possible bug here. Although in our current use case this will not impact. 
        # But for residential telephony service it will fail some calls for subscribers 
        # that do not support P-Asserted-Identity or P-Preffered-Identity    

        $var(new_rpid) = "<sip:"+$avp(sub_rpid)+"@sip.local>;party=calling;screen=yes;privacy=off";
        remove_hf("Remote-Party-ID");
        remove_hf("P-Preferred-Identity");
        append_hf("Remote-Party-ID: $var(new_rpid)\r\n");

        xlog("'$rm' FROM $si TO $socket_in(ip) - New RPID: $var(new_rpid) \n");

        xlog("sub_rpid: $avp(sub_rpid) \n");
        route(FETCH_GW_ID);

    }
    
    xlog("'$rm' FROM $si TO $socket_in(ip) - call-id '$ci' - gw_id: $var(gw_id) \n");
    
    ## Read failover CallerID from 'X-FOCID' Custom SIP Header

    $avp(retry_did)='';
    $avp(retry_did)=$hdr(X-FOCID); 

    ## temporary implement failover/x-focid for albarq CLI from +966115219810 to +966125782555
