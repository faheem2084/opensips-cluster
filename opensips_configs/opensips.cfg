####### Routing Logic ########
# main request routing logic
route{

    if($ua =~ "friendly-scanner|sipcli|VaxSIPUserAgent") {
        # silently drop SIP scanners - uncomment next line if want to reply
        # sl_send_reply("200", "OK");
        exit;
    }
    ### Block requests based on the caller. 
    ## uncomment below lines to & change the CID.

    if ($rm =="INVITE" && ($fU=="+966115219786") ){
    	send_reply(486,"Busy Here");
    	exit;
    }	

    if ($rm =="INVITE" && ($fU=="+966115219772") ){
        send_reply(486,"Busy Here");
        exit;
    }

    if ($rm =="INVITE" && ($fU=="+966125782472") ){
        send_reply(486,"Busy Here");
        exit;
    }


    if (!mf_process_maxfwd_header(10)) {
        send_reply(483,"Too Many Hops");
        exit;
    }

    # store the current time (at request processing)
    $avp(start_time) = $Ts ; 

    xlog("[$socket_in(proto):$fU@$si:$sp] '$rm' IN From '$fu' to '$tu' - call-id '$ci' - UA:'$ua' \n");

    ### Validate REQUEST URI and FROM URI for possible sql injection
    if ($rm == "REGISTER" || $rm =="INVITE"){
        if( ($fU =~ "^\+[0-9]{8,14}|[0-9]{8}") || $tu =~ "^\+[0-9]{8,14}|[0-9]{8}"){
            xlog("'$rm' FROM $si TO $socket_in(ip) - call-id '$ci' - FROM or TO are valid E.164 numbers or 8 digit username \n");
            
        }else{      
            xlog("'$rm' FROM $si TO $socket_in(ip) - call-id '$ci' - suspicious request rejected statlessly \n");
            exit;
        }
    }

    ## Handling temu DID provisioning, Source IP Validation and Destinations validation
    if ($rm =="INVITE" && ($fU=="+966115219870") ){ 
        if ($si == "20.223.94.65" || $si == "23.249.55.124" || $si == "152.42.144.114" || $si == "104.248.150.114" || $si == "139.59.34.94" || $si == "165.232.186.228" || $si == "137.184.4.155" || $si == "108.61.169.31" || $si == "167.99.198.84" || $si == "159.65.244.171" || $si == "157.175.131.128" || $si == "170.64.128.96" || $si == "138.68.125.160" || $si == "104.248.176.184" || $si == "188.166.126.7" || $si == "198.13.56.186" || $si == "13.245.35.235") { # Your logic here }
            if( $tU =~ "^\+966*" ){
                xlog("Incoming Request from TEMU IP: $si , processing the call..");
            } else{
                xlog("Incoming request from TEMU, $tU - Destination not provisioned");
                sl_send_reply(404,"Destination Not Provisioned");
                exit;
            }
        }else{
            xlog("Temu Request from Unknown source IP");
            sl_send_reply(404,"IP Not Provisioned");
            exit;

        }
    }


    if(is_method("OPTIONS") ) {
        sl_send_reply(200,"Keepalive");
        exit;
    }

    if (has_totag()) {
        xlog(" rm => $rm | call-id => $ci | rU => $rU | fU => $fU | src_ip => $si | Request contains to_tag() \n");
        if(topology_hiding_match()) {
            xlog(" rm => $rm | call-id => $ci | rU => $rU | fU => $fU | src_ip => $si | topology_hiding_match() found, relay request \n");
            route(relay);
            exit;
        }
    }



    if (is_method("CANCEL")) {
        xlog("'$rm' FROM $si TO $socket_in(ip) - call-id '$ci' - CANCEL Received \n");              
        t_add_cancel_reason("Reason: SIP ;cause=480 ;text=\"NO_ANSWER\"\r\n");
        if (t_check_trans()){
            t_relay();
        }
        #do_accounting("db","cdr|failed|missed","acc");
	    exit;
    }


    # absorb retransmissions, but do not create transaction
    t_check_trans();


    #### FIX Contact Address for initial requests
    # FIX Contact Address for SIP Client behind KSA Firewall/NAT

    if ( is_method("INVITE") && !has_totag() ){
        xlog("'$rm' FROM $si TO $socket_in(ip) - call-id '$ci' - fix CONTACT ADDRESS for intial INVITE \n");
        if (nat_uac_test("private-contact,diff-ip-src-via,diff-port-src-via")) { 
            fix_contact();
            #rtpproxy_engage("ro","");
        }
        rtpproxy_engage("ro");
        nat_keepalive();

    }

    if ( is_method("REGISTER") ) {
        nat_keepalive();
    }

    $avp(sw_dapp) = '';
    $avp(sw_dapp_port) = '';
    $avp(sw_dapp_transport) = '';

    ## Handle incoming INVITEs from Zain and Mobily voice gateways.
    
    
    ## Provision incoming call from the address table.
    if(is_method("INVITE") && check_address(0,"$si",0,"ANY") ){

        ## Fetch Active platform from the DB

        xlog("------------------------------ Incoming calls");
        $avp(platform) = "signalwire";

        avp_db_query("select platform, lb_group_id 
                        from cpass_platform 
                        where callerid='$rU'",
                        "$avp(platform);$avp(lb_group_id)");


        xlog("Platform: $avp(platform) \n");

        if( $avp(platform) == "signalwire"){

            # Fetch the domain app for each DID number from sw_dapp table
            avp_db_query("select sw_dapp, sw_dapp_port,sw_dapp_transport,sw_dapp_desc 
                            from sw_ib_routing where req_user='$rU'",
                            "$avp(sw_dapp);$avp(sw_dapp_port);$avp(sw_dapp_transport);$avp(sw_dapp_desc)");
            $ru = "sip:" + $rU + "@" + $avp(sw_dapp) + ":" + $avp(sw_dapp_port) + ";transport=" + $avp(sw_dapp_transport);
            $du = $ru;

        }else{
            xlog("Forward incoming call to Asterisk");
            $avp(sw_dapp_desc) = "Asterisk Dialer Cluster";
            $var(lb_rc)=lb_start($avp(lb_group_id),"transc;pstn");
            if ($var(lb_rc)  < 0 ) {
                xlog("'$rm' FROM $si TO $socket_in(ip) - lb_start failed\n");
                sl_send_reply(500,"Service full");
                exit;
            }
        } 
   
        ## Process the call 
        record_route();

        $var(new_uri) = "sip:"+$fU+"@sip.local" ;
        uac_replace_from("","$var(new_uri)");

        $var(new_uri) = "sip:"+$tU+"@sip.local" ;
        uac_replace_to("", "$var(new_uri)");

        ## Adjust accounting call logs.
        $acc_extra(src_user)=$fU;
        $acc_extra(src_domain)=$fd;
        $acc_extra(src_ip) = $si;
        $acc_extra(dst_ouser)=$tU;
        $acc_extra(dst_user)=$rU;
        $acc_extra(sid)=$ci;


        remove_hf("X-FS-Support");
        topology_hiding();

        do_accounting("db","cdr|missed|failed","acc");
        
        xlog("'$rm' FROM $si TO $socket_in(ip) - call-id '$ci' - Incoming Call  - Routing call to $avp(sw_dapp_desc) \n");
        route(relay);
        exit;

    }


    # Authenticate Regular INVITE for Outbound Calls

    if ( (is_method("INVITE")  ) ) {
        if (is_from_local()) {
            xlog("'$rm' FROM $si TO $socket_in(ip) - call-id '$ci' - domain part of FROM URI is from Local Domain \n");
            # authenticate if FROM is local subscriber
            # authenticate all initial non-REGISTER request that pretend to be
            # generated by local subscriber (domain part from FROM URI is local domain)

            $var(auth_code) = proxy_authorize("", "subscriber");
            if ( $var(auth_code) == -1 || $var(auth_code) == -2 ) {
                xlog("'$rm' FROM $si TO $socket_in(ip) - INVITE ERROR for $fU@$fd from $si cause $var(auth_code)");
            }
            if ( $var(auth_code) < 0 ) {
                xlog("Proxy Challenge");
                proxy_challenge("", "auth"); 
                xlog("'$rm' FROM $si TO $socket_in(ip) - Proxy Challenge completed...\n");
                exit;
            }

            if( $au==$fU  || is_uri_host_local() ){        
                xlog("L_NOTICE", "'$rm' FROM $si TO $socket_in(ip) - call-id '$ci' - SIP REQUEST is from LOCAL Domain or Foreign provisioned Domains \n");
            } else {
                xlog("L_NOTICE", "'$rm' FROM $si TO $socket_in(ip) - call-id '$ci' - Unauthorized Request \n");
                send_reply(403,"Forbidden auth ID");
                exit;
            }

            consume_credentials();
            # caller authenticated

        } else {
           
            xlog("'$rm' FROM $si TO $socket_in(ip) - FROM is not our domain \n");
            # if caller is not local, then called number must be local

            if (!is_uri_host_local()) {
            
                xlog("'$rm' FROM $si TO $socket_in(ip) - call-id '$ci' - SIP URI is not from known SIP Domains\n");
                send_reply(403,"Relay Forbidden");
                exit;
            }

            send_reply(403,"Relay Forbidden");
            exit;

        }

    }

    # preloaded route checking

    if (loose_route()) {
    
        xlog("L_ERR", "'$rm' FROM $si TO $socket_in(ip) - Attempt to route with preloaded Route's [$fu|$tu|$ru|$ci]");
        if (!is_method("ACK"))
            send_reply(403,"Preload Route denied");
        exit;
    }

    # record routing
    if (!is_method("REGISTER|MESSAGE")){
        record_route();
    }

    # SIP Domains(SIP DNS) or SIP Domains IP address Should be
    #  whitelisted first in sip domains table.
    if (!is_uri_host_local()) {
        #append_hf("P-hint: outbound\r\n");
        send_reply(404,"Request rejected");
        #route(relay);
        exit;
    }

    # requests for my domain
    if (is_method("PUBLISH|SUBSCRIBE")) {
        send_reply(503, "Service Unavailable");
        exit;
    }

    # SIP Registration for Telebu or Local SIP Subscribers
    if (is_method("REGISTER")) {
        # authenticate the REGISTER requests
        if (!www_authorize("", "subscriber")) {
            www_challenge("", "auth");
            exit;
        }

        if ($au != $tU) {
            send_reply(403,"Forbidden auth ID");
            exit;
        }

        if ($socket_in(proto) == "tcp" || $socket_in(proto) == "tls")
            setflag("TCP_PERSISTENT");
        
        if (isflagset("NAT")) {
            setbflag("SIP_PING_FLAG");
        }
        
        if (!save("location"))
            sl_reply_error();

        exit;
    }


    # request with no Username in RURI
    if ($rU==NULL) {
        send_reply(484,"Address Incomplete");
        exit;
    }


    # Call routing for PSTN Termination
    
    $acc_extra(src_user)=$fU;
    $acc_extra(src_domain)=$fd;
    $acc_extra(src_ip) = $si;
    $acc_extra(dst_ouser)=$tU;
    $acc_extra(dst_user)=$rU;

    $var(sid) = $hdr(X-CALL-SID);
    $acc_extra(sid)=$var(sid);

    do_accounting("db","cdr|missed|failed","acc");
    xlog("Call SID: $var(sid) \n");

    $var(gw_id)=0;


    #### Call expiry implemenation
    if(is_present_hf("X-EXPIRY")){

        $var(expiry) = 0;
        $var(sec) = 0; 
        $var(usec) = 0;

        $var(expiry) = $hdr(X-EXPIRY);

        xlog("'$rm' FROM $si TO $socket_in(ip) - EXPIRY HEADER EXISTS, expiry stamp, $var(expiry)\n");
        get_accurate_time($var(sec), $var(usec));
        xlog("'$rm' FROM $si TO $socket_in(ip) - Current UNIX timestamp: $var(sec) s, $var(usec) us\n");

        xlog("'$rm' FROM $si TO $socket_in(ip) - Current Time: $(var(sec){s.int}) \n");
        xlog("'$rm' FROM $si TO $socket_in(ip) - Expiry Time: $(var(expiry){s.int}) \n");

        #	xlog("Current UNIX timestamp: $var(sec) s, $var(usec) us\n");
        if( $(var(expiry){s.int}) > $(var(sec){s.int}) ){

            xlog("'$rm' FROM $si TO $socket_in(ip) - call-id '$ci' - Call expiry in future\n");

        } else{  
            xlog("'$rm' FROM $si TO $socket_in(ip) - call-id '$ci' - Call is expired, Rejecting \n");
            send_reply(486,"Call Expired");
            exit;           
        }

   }

#+97144127[0-6][0-9]

   ####### Route All outbound Zain calls with callerID +966115219100 should be re-routed via Mobily CallerID from X-FOCID 
